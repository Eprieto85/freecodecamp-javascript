<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinanzApp — Administrador de Cuentas</title>
  <style>
    :root{--bg:#0a0f1e;--surface:#111827;--surface2:#1a2235;--border:#1f2d47;--income:#22c55e;--expense:#ef4444;--accent:#3b82f6;--accent2:#8b5cf6;--text:#e2e8f0;--muted:#64748b;--radius:10px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:1.5rem 1rem}
    .app{max-width:960px;margin:0 auto}
    /* HEADER */
    .app-header{text-align:center;margin-bottom:1.8rem}
    .app-header h1{font-size:1.8rem;font-weight:800}
    .app-header h1 span{background:linear-gradient(135deg,var(--income),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .app-header p{color:var(--muted);font-size:.82rem;margin-top:.3rem}
    /* SUMMARY CARDS */
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
    @media(max-width:580px){.summary{grid-template-columns:1fr}}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem}
    .card-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.5rem}
    .card-value{font-size:1.5rem;font-weight:800;line-height:1}
    .card-value.balance{color:var(--text)}
    .card-value.income{color:var(--income)}
    .card-value.expense{color:var(--expense)}
    .card-delta{font-size:.72rem;color:var(--muted);margin-top:.4rem}
    /* MAIN LAYOUT */
    .main-grid{display:grid;grid-template-columns:1fr 340px;gap:1.2rem}
    @media(max-width:720px){.main-grid{grid-template-columns:1fr}}
    /* SECTION HEADERS */
    .section-title{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.8rem;display:flex;align-items:center;justify-content:space-between}
    /* TRANSACTIONS */
    .txn-filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
    .filter-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;font-size:.75rem;font-weight:600;padding:.3rem .7rem;transition:all .15s}
    .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.1)}
    .txn-list{display:flex;flex-direction:column;gap:.5rem;max-height:400px;overflow-y:auto;padding-right:.3rem}
    .txn-list::-webkit-scrollbar{width:5px}
    .txn-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    .txn-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.8rem 1rem;display:flex;align-items:center;gap:.9rem;transition:border-color .2s}
    .txn-item:hover{border-color:var(--accent)}
    .txn-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
    .txn-info{flex:1;min-width:0}
    .txn-desc{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .txn-meta{font-size:.7rem;color:var(--muted);margin-top:.15rem}
    .txn-amount{font-size:.95rem;font-weight:800;flex-shrink:0}
    .txn-amount.inc{color:var(--income)}
    .txn-amount.exp{color:var(--expense)}
    .txn-del{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:.2rem;transition:color .15s;flex-shrink:0}
    .txn-del:hover{color:var(--expense)}
    /* FORM */
    .add-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem}
    .form-row{margin-bottom:.8rem}
    .form-row label{display:block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.3rem}
    .form-row input,.form-row select{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.88rem;padding:.55rem .85rem;width:100%;outline:none;font-family:inherit;transition:border-color .2s}
    .form-row input:focus,.form-row select:focus{border-color:var(--accent)}
    .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.8rem}
    .type-btn{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--muted);cursor:pointer;font-size:.82rem;font-weight:700;padding:.5rem;text-align:center;transition:all .2s}
    .type-btn.inc.active{background:rgba(34,197,94,.15);border-color:var(--income);color:var(--income)}
    .type-btn.exp.active{background:rgba(239,68,68,.15);border-color:var(--expense);color:var(--expense)}
    .add-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:.88rem;font-weight:700;padding:.65rem;width:100%;transition:opacity .15s;margin-top:.3rem}
    .add-btn:hover{opacity:.88}
    /* CHART */
    .chart-wrap{margin-top:1.2rem}
    .bar-chart{display:flex;flex-direction:column;gap:.5rem}
    .cat-row{display:flex;align-items:center;gap:.7rem}
    .cat-name{font-size:.75rem;min-width:90px;color:var(--muted)}
    .cat-bar-track{flex:1;background:var(--surface2);border-radius:4px;height:8px;overflow:hidden}
    .cat-bar-fill{height:100%;border-radius:4px;transition:width .5s}
    .cat-amount{font-size:.72rem;color:var(--muted);min-width:65px;text-align:right}
    /* TOAST */
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--income);color:#111;padding:.6rem 1.2rem;border-radius:8px;font-size:.85rem;font-weight:700;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;z-index:999}
    .toast.show{opacity:1;transform:translateY(0)}
    .empty{text-align:center;padding:2rem;color:var(--muted);font-size:.88rem}
  </style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <h1>Finanz<span>App</span></h1>
    <p>Administrador personal de cuentas y gastos</p>
  </div>

  <div class="summary">
    <div class="card">
      <div class="card-label">Balance Total</div>
      <div class="card-value balance" id="card-balance">$0.00</div>
      <div class="card-delta" id="card-txn-count">0 transacciones</div>
    </div>
    <div class="card">
      <div class="card-label">Total Ingresos</div>
      <div class="card-value income" id="card-income">$0.00</div>
      <div class="card-delta" id="card-income-count">este mes</div>
    </div>
    <div class="card">
      <div class="card-label">Total Gastos</div>
      <div class="card-value expense" id="card-expense">$0.00</div>
      <div class="card-delta" id="card-expense-count">este mes</div>
    </div>
  </div>

  <div class="main-grid">
    <!-- TRANSACTIONS -->
    <div>
      <div class="section-title">
        <span>Transacciones</span>
        <span id="txn-count-label" style="font-weight:400"></span>
      </div>
      <div class="txn-filters">
        <button class="filter-btn active" onclick="setFilter('all',this)">Todas</button>
        <button class="filter-btn" onclick="setFilter('income',this)">Ingresos</button>
        <button class="filter-btn" onclick="setFilter('expense',this)">Gastos</button>
        <button class="filter-btn" onclick="setFilter('Alimentación',this)">🍔 Comida</button>
        <button class="filter-btn" onclick="setFilter('Transporte',this)">🚌 Transporte</button>
        <button class="filter-btn" onclick="setFilter('Salario',this)">💼 Salario</button>
      </div>
      <div class="txn-list" id="txn-list"></div>

      <!-- CATEGORY CHART -->
      <div class="chart-wrap">
        <div class="section-title" style="margin-top:1.2rem">Gastos por categoría</div>
        <div class="bar-chart" id="cat-chart"></div>
      </div>
    </div>

    <!-- ADD FORM -->
    <div>
      <div class="section-title">Agregar Transacción</div>
      <div class="add-form">
        <div class="type-toggle">
          <div class="type-btn inc active" id="type-inc" onclick="setType('income')">▲ Ingreso</div>
          <div class="type-btn exp" id="type-exp" onclick="setType('expense')">▼ Gasto</div>
        </div>
        <div class="form-row">
          <label>Descripción</label>
          <input type="text" id="f-desc" placeholder="ej. Almuerzo, Salario..."/>
        </div>
        <div class="form-row">
          <label>Monto ($)</label>
          <input type="number" id="f-amount" placeholder="0.00" min="0.01" step="0.01"/>
        </div>
        <div class="form-row">
          <label>Categoría</label>
          <select id="f-cat">
            <option>Salario</option>
            <option>Freelance</option>
            <option>Alimentación</option>
            <option>Transporte</option>
            <option>Vivienda</option>
            <option>Educación</option>
            <option>Entretenimiento</option>
            <option>Salud</option>
            <option>Ropa</option>
            <option>Otros</option>
          </select>
        </div>
        <div class="form-row">
          <label>Fecha</label>
          <input type="date" id="f-date"/>
        </div>
        <button class="add-btn" onclick="addTransaction()">+ Agregar Transacción</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const CAT_ICONS = {Salario:'💼',Freelance:'💻',Alimentación:'🍔',Transporte:'🚌',Vivienda:'🏠',Educación:'📚',Entretenimiento:'🎬',Salud:'💊',Ropa:'👕',Otros:'📌'};
  const CAT_COLORS = {Salario:'#22c55e',Freelance:'#3b82f6',Alimentación:'#f59e0b',Transporte:'#8b5cf6',Vivienda:'#06b6d4',Educación:'#ec4899',Entretenimiento:'#f97316',Salud:'#ef4444',Ropa:'#a78bfa',Otros:'#64748b'};

  let txns = [
    {id:1,type:'income',desc:'Salario mensual',amount:3500,cat:'Salario',date:'2026-11-01'},
    {id:2,type:'expense',desc:'Arriendo',amount:900,cat:'Vivienda',date:'2026-11-01'},
    {id:3,type:'expense',desc:'Supermercado',amount:220,cat:'Alimentación',date:'2026-11-05'},
    {id:4,type:'income',desc:'Proyecto freelance',amount:650,cat:'Freelance',date:'2026-11-08'},
    {id:5,type:'expense',desc:'Transporte mensual',amount:80,cat:'Transporte',date:'2026-11-10'},
    {id:6,type:'expense',desc:'Curso online',amount:49,cat:'Educación',date:'2026-11-12'},
    {id:7,type:'expense',desc:'Restaurante',amount:35,cat:'Alimentación',date:'2026-11-14'},
  ];
  let nextId = 8;
  let currentType = 'income';
  let currentFilter = 'all';

  // set today as default date
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];

  function setType(t) {
    currentType = t;
    document.getElementById('type-inc').classList.toggle('active', t==='income');
    document.getElementById('type-exp').classList.toggle('active', t==='expense');
    // update category defaults
    const sel = document.getElementById('f-cat');
    if(t==='income') { sel.value='Salario'; }
    else { sel.value='Alimentación'; }
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  }

  function addTransaction() {
    const desc = document.getElementById('f-desc').value.trim();
    const amount = parseFloat(document.getElementById('f-amount').value);
    const cat = document.getElementById('f-cat').value;
    const date = document.getElementById('f-date').value;
    if(!desc){ toast('Escribe una descripción'); return; }
    if(!amount||amount<=0){ toast('Monto inválido'); return; }
    txns.unshift({id:nextId++,type:currentType,desc,amount,cat,date});
    document.getElementById('f-desc').value='';
    document.getElementById('f-amount').value='';
    toast(currentType==='income'?'Ingreso agregado ✓':'Gasto agregado ✓');
    render();
  }

  function deleteTransaction(id) {
    txns = txns.filter(t=>t.id!==id);
    render();
    toast('Eliminado');
  }

  function render() { renderSummary(); renderList(); renderChart(); }

  function renderSummary() {
    const income = txns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const expense = txns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const balance = income - expense;
    const fmt = n => '$' + n.toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
    document.getElementById('card-balance').textContent = fmt(balance);
    document.getElementById('card-balance').style.color = balance>=0?'var(--income)':'var(--expense)';
    document.getElementById('card-income').textContent = fmt(income);
    document.getElementById('card-expense').textContent = fmt(expense);
    document.getElementById('card-txn-count').textContent = txns.length + ' transacciones';
    document.getElementById('card-income-count').textContent = txns.filter(t=>t.type==='income').length + ' registros';
    document.getElementById('card-expense-count').textContent = txns.filter(t=>t.type==='expense').length + ' registros';
  }

  function renderList() {
    const list = document.getElementById('txn-list');
    let filtered = txns;
    if(currentFilter==='income') filtered = txns.filter(t=>t.type==='income');
    else if(currentFilter==='expense') filtered = txns.filter(t=>t.type==='expense');
    else if(currentFilter!=='all') filtered = txns.filter(t=>t.cat===currentFilter);
    document.getElementById('txn-count-label').textContent = filtered.length + ' registros';
    if(!filtered.length){ list.innerHTML='<div class="empty">No hay transacciones</div>'; return; }
    const fmt = (t,n) => (t==='income'?'+':'-') + '$' + n.toLocaleString('es-CO',{minimumFractionDigits:2});
    list.innerHTML = filtered.map(t=>`
      <div class="txn-item">
        <div class="txn-icon" style="background:${CAT_COLORS[t.cat]||'#64748b'}22">${CAT_ICONS[t.cat]||'📌'}</div>
        <div class="txn-info">
          <div class="txn-desc">${t.desc}</div>
          <div class="txn-meta">${t.cat} · ${formatDate(t.date)}</div>
        </div>
        <div class="txn-amount ${t.type==='income'?'inc':'exp'}">${fmt(t.type,t.amount)}</div>
        <button class="txn-del" onclick="deleteTransaction(${t.id})" title="Eliminar">✕</button>
      </div>`).join('');
  }

  function renderChart() {
    const chart = document.getElementById('cat-chart');
    const expenses = txns.filter(t=>t.type==='expense');
    const catMap = {};
    expenses.forEach(t=>{ catMap[t.cat]=(catMap[t.cat]||0)+t.amount; });
    const sorted = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const max = sorted[0]?.[1]||1;
    const fmt = n => '$'+n.toLocaleString('es-CO',{minimumFractionDigits:0});
    if(!sorted.length){ chart.innerHTML='<div class="empty">Sin gastos aún</div>'; return; }
    chart.innerHTML = sorted.map(([cat,amt])=>`
      <div class="cat-row">
        <div class="cat-name">${CAT_ICONS[cat]||''} ${cat}</div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(amt/max*100)}%;background:${CAT_COLORS[cat]||'#64748b'}"></div></div>
        <div class="cat-amount">${fmt(amt)}</div>
      </div>`).join('');
  }

  function formatDate(d) {
    if(!d) return '';
    const [y,m,day] = d.split('-');
    const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    return `${day} ${months[+m-1]} ${y}`;
  }

  function toast(msg) {
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2200);
  }

  render();
</script>
</body>
</html>
